[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Every test in this suite is async (the app is async top to bottom), so opt in
# globally rather than decorating each one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    regression: guards a specific bug found by /qa — see the ISSUE-NNN comment in the test
