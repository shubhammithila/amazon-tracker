<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Tracker v2 — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 36px 40px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 380px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo h1 { font-size: 17px; font-weight: 700; color: var(--text); }
    .logo p  { font-size: 12px; color:var(--text-muted); margin-top: 1px; }
    label { display: block; font-size: 12px; font-weight: 600; color:var(--text-muted);
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    input[type=password] {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border-strong); border-radius: 8px;
      background: var(--surface); color: var(--text);
      font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    input[type=password]:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 16px;
      padding: 11px; background: var(--accent); color:var(--on-accent);
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background:var(--accent-hover); }
    .error {
      margin-top: 14px; padding: 9px 12px;
      background: var(--red-soft); border: 1px solid var(--red-soft); border-radius: 6px;
      color:var(--red); font-size: 13px; text-align: center;
    }
    .footer { margin-top: 24px; font-size: 11px; color:var(--text-muted); text-align: center; }
  </style>
<link rel="stylesheet" href="/static/theme.css"/>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">📦</div>
      <div>
        <h1>Amazon Tracker v2</h1>
        <p>Private — sign in to continue</p>
      </div>
    </div>

    <form method="POST">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter your password" autofocus autocomplete="current-password" />
      <button type="submit">Sign In</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  </div>
  <div class="footer">Amazon Tracker v2 &nbsp;·&nbsp; httpx + FastAPI + PostgreSQL</div>
</body>
</html>
